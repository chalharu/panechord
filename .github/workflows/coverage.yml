# Single CI pipeline: build once, distribute, run per OS, merge on SonarCloud.
#
# Linux test binaries are built once inside the prebuilt GHCR container
# (.github/workflows/docker/Dockerfile.ci, content-hash tagged) and fanned
# out to the Linux run legs as nextest archives -- the same distribution
# pattern as nerust's rom-tests. Display examples are compiled once in the
# examples leg and every leg runs its binaries under llvm-cov, so each
# binary is built exactly once and all legs contribute coverage. No `apt-get`
# runs inside any Linux job, so Ubuntu-repository flakes cannot fail the gate
# and the environment setup is a container pull plus the Rust cache.
#
# Windows/macOS archives are NOT cross-built from Ubuntu: GTK system
# libraries, the Tao Windows links and the AppKit/Swift bridge cannot link
# from a Linux sysroot, and a cross sysroot (xwin/osxcross) would reintroduce
# exactly the flakiness this pipeline removes. Each foreign OS builds its own
# archive natively on its own runner, uploads it, and the paired run job
# downloads and executes it -- distribution still holds, per OS.
# macOS display tests stay out of CI: they need an interactive desktop
# (see scripts/verify-macos.sh); the macOS leg runs the headless subset only.
name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "macos/native/**"
      - "scripts/**"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/docker/Dockerfile.ci"
  pull_request:
    paths:
      - "**.rs"
      - "**.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "macos/native/**"
      - "scripts/**"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/docker/Dockerfile.ci"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # Single source for prebuilt CI tool versions. Renovate tracks the
  # annotated lines below; new releases apply only after the 3-day
  # minimum release age.
  NEXTEST_VERSION: "0.9.150" # renovate: datasource=crate depName=cargo-nextest
  LLVM_COV_VERSION: "0.9.1" # renovate: datasource=crate depName=cargo-llvm-cov
  RUST_TOOLCHAIN: "1.99.1" # renovate: datasource=github-releases depName=rust-lang/rust

jobs:
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    outputs:
      image_tag: "${{ steps.set-tag.outputs.tag }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ hashFiles('.github/workflows/docker/Dockerfile.ci') }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists
        id: check-image
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: docker pull "ghcr.io/$GH_REPO/ci-image-panechord:$IMAGE_TAG"
      - name: Build and push if not exists
        if: steps.check-image.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/workflows/docker/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ steps.set-tag.outputs.tag }}
          provenance: false

  lint:
    name: Lint (container)
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Unique target cache per job: heterogeneous jobs sharing one key
          # poison each other (e.g. a clippy-only or failed partial target).
          # The registry stays shared via shared-key (immutable content).
          key: panechord-lint
          shared-key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: Format check
        run: >-
          cargo fmt -p panechord -p panechord-runtime -p panechord-markup -p panechord-macros
          -p panechord-gtk -p panechord-tao -p panechord-macos -p panechord-demo
          -p panechord-library -- --check
      - name: Clippy
        run: >-
          cargo clippy --locked -p panechord -p panechord-runtime -p panechord-markup
          -p panechord-macros -p panechord-gtk -p panechord-tao -p panechord-macos
          -p panechord-demo -p panechord-library --all-targets -- -D warnings
      - name: Clippy (Tao backend)
        run: >-
          cargo clippy --locked -p panechord-demo --all-targets
          --no-default-features --features backend-tao -- -D warnings
      - name: Clippy library (Tao backend)
        run: >-
          cargo clippy --locked -p panechord-library --all-targets --no-default-features
          --features backend-tao -- -D warnings
      - name: YAML rustc wrapper tests
        run: python3 scripts/test-yaml-rustc.py

  archive-linux:
    name: Build Linux archive
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Unique target cache per job: heterogeneous jobs sharing one key
          # poison each other (e.g. a clippy-only or failed partial target).
          # The registry stays shared via shared-key (immutable content).
          key: panechord-archive-linux
          shared-key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Build test archives
        run: |
          export RUSTFLAGS="${RUSTFLAGS-} -C link-arg=-fuse-ld=mold -C debuginfo=0"
          mkdir -p artifacts
          # Default features resolve demo/library to the GTK backend.
          cargo llvm-cov nextest-archive --workspace -E 'not binary(cargo_ui)' \
            --archive-file artifacts/linux-gtk.tar.zst
          # One archive for the Tao backend: the flag applies to the packages
          # that define it (demo/library); featureless packages are unaffected.
          cargo llvm-cov nextest-archive -p panechord-tao -p panechord-library \
            --no-default-features --features backend-tao -E 'not binary(cargo_ui)' \
            --archive-file artifacts/linux-tao.tar.zst
      - name: Upload test archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-archive-linux
          path: artifacts/*.tar.zst
          compression-level: 0
          retention-days: 1

  run-linux-headless:
    name: Linux headless (nextest)
    needs: [prepare-image, archive-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive-linux
          path: artifacts
      - name: Run headless tests with coverage
        run: |
          mkdir -p coverage target/llvm-cov-target
          cargo llvm-cov nextest --no-report --archive-file artifacts/linux-gtk.tar.zst \
            -E 'package(panechord-runtime) or package(panechord-markup) or package(panechord-macros)'
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-gtk.tar.zst \
            -p panechord-runtime -p panechord-markup -p panechord-macros \
            --lcov --output-path coverage/raw.info
          sh scripts/lcov-workspace.sh coverage/raw.info coverage/lcov-linux-headless.info
          rm coverage/raw.info
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-linux-headless
          path: coverage/*.info
          retention-days: 1

  run-linux-gtk:
    name: Linux GTK display (nextest, Xvfb)
    needs: [prepare-image, archive-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_IM_MODULE: simple
      PANECHORD_REQUIRE_XTEST: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive-linux
          path: artifacts
      # nextest isolates each test in its own process, which the GTK3/GTK4
      # separation requires (see scripts/verify.sh).
      - name: Run GTK tests with coverage
        run: |
          export PANECHORD_ALLOW_CLIPBOARD_PROBE=1
          # Each archive run extracts into target/llvm-cov-target and collides
          # with any previous content (stale or from an earlier invocation),
          # so start clean and report + drop the dir between runs.
          rm -rf target/llvm-cov-target
          mkdir -p coverage target/llvm-cov-target
          xvfb-run cargo llvm-cov nextest --no-report --archive-file artifacts/linux-gtk.tar.zst \
            -E 'package(panechord-gtk) or package(panechord-library)'
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-gtk.tar.zst \
            -p panechord-gtk -p panechord-library \
            --lcov --output-path coverage/raw-gtk.info
          rm -rf target/llvm-cov-target
          mkdir -p target/llvm-cov-target
          # Display tests need exclusive desktop access (focus, clipboard,
          # XTest delivery): serialize like verify.sh's --test-threads=1,
          # or concurrent windows steal each other's input.
          xvfb-run cargo llvm-cov nextest --no-report --archive-file artifacts/linux-gtk.tar.zst \
            --test-threads 1 -E 'package(panechord-gtk)' --run-ignored only
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-gtk.tar.zst \
            -p panechord-gtk \
            --lcov --output-path coverage/raw-gtk-ignored.info
          rm -rf target/llvm-cov-target
          mkdir -p target/llvm-cov-target
          # HiDPI geometry variant of the grid contract (verify.sh parity).
          # Its own extract/report cycle: reusing the ignored run's directory
          # would collide on extraction, and its profraws must not leak into
          # other reports. SonarCloud merges the per-leg fragments.
          GDK_SCALE=2 xvfb-run cargo llvm-cov nextest --no-report --archive-file artifacts/linux-gtk.tar.zst \
            -E 'test(tests::native_grid_equal_columns_geometry_and_spans)'
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-gtk.tar.zst \
            -p panechord-gtk \
            --lcov --output-path coverage/raw-gtk-hidpi.info
          rm -rf target/llvm-cov-target
          for raw in coverage/raw-gtk.info coverage/raw-gtk-ignored.info coverage/raw-gtk-hidpi.info; do
            out="coverage/lcov-linux-$(basename "$raw" .info | sed 's/^raw-//').info"
            sh scripts/lcov-workspace.sh "$raw" "$out"
            rm "$raw"
          done
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-linux-gtk
          path: coverage/*.info
          retention-days: 1

  run-linux-tao:
    name: Linux Tao display (nextest, Xvfb)
    needs: [prepare-image, archive-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GTK_IM_MODULE: simple
      PANECHORD_REQUIRE_XTEST: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive-linux
          path: artifacts
      - name: Run Tao tests with coverage
        run: |
          export PANECHORD_ALLOW_CLIPBOARD_PROBE=1
          # Each archive run extracts into target/llvm-cov-target and collides
          # with any previous content (stale or from an earlier invocation),
          # so start clean and report + drop the dir between runs.
          rm -rf target/llvm-cov-target
          mkdir -p coverage target/llvm-cov-target
          xvfb-run cargo llvm-cov nextest --no-report --archive-file artifacts/linux-tao.tar.zst
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-tao.tar.zst \
            -p panechord-tao -p panechord-library \
            --lcov --output-path coverage/raw-tao.info
          rm -rf target/llvm-cov-target
          mkdir -p target/llvm-cov-target
          # Display tests need exclusive desktop access (focus, clipboard,
          # XTest delivery): serialize like verify.sh's --test-threads=1,
          # or concurrent windows steal each other's input.
          xvfb-run cargo llvm-cov nextest --no-report --archive-file artifacts/linux-tao.tar.zst \
            --test-threads 1 --run-ignored only
          cargo llvm-cov report \
            --nextest-archive-file artifacts/linux-tao.tar.zst \
            -p panechord-tao \
            --lcov --output-path coverage/raw-tao-ignored.info
          rm -rf target/llvm-cov-target
          for raw in coverage/raw-tao.info coverage/raw-tao-ignored.info; do
            out="coverage/lcov-linux-$(basename "$raw" .info | sed 's/^raw-//').info"
            sh scripts/lcov-workspace.sh "$raw" "$out"
            rm "$raw"
          done
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-linux-tao
          path: coverage/*.info
          retention-days: 1

  run-linux-examples:
    name: Linux examples (Xvfb)
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_IM_MODULE: simple
      PANECHORD_REQUIRE_XTEST: 1
      PANECHORD_ALLOW_CLIPBOARD_PROBE: 1
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Unique target cache per job: heterogeneous jobs sharing one key
          # poison each other (e.g. a clippy-only or failed partial target).
          # The registry stays shared via shared-key (immutable content).
          key: panechord-examples
          shared-key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      # Example binaries are built once here, not per display leg, and every
      # run below reuses them through llvm-cov fingerprints. Plain cargo
      # builds cannot instrument: seed the instrumented flags from show-env
      # so the timed runs below never compile inside their 45s bounds.
      - name: Warm instrumented example builds
        run: |
          rm -rf target/llvm-cov-target
          show_env="$(cargo llvm-cov show-env --sh 2>/dev/null | grep '^export ')"
          [ -n "$show_env" ] || { echo 'llvm-cov show-env produced no exports' >&2; exit 1; }
          eval "$show_env"
          cargo build --locked -p panechord-runtime --example scaling
          cargo build --locked -p panechord-demo --examples
          cargo build --locked -p panechord-demo --bins
          cargo build --locked -p panechord-tao --examples
          cargo build --locked -p panechord-library --bins
          cargo build --locked --no-default-features --features backend-tao -p panechord-demo --examples
          cargo build --locked --no-default-features --features backend-tao -p panechord-demo --bins
          cargo build --locked --no-default-features --features backend-tao -p panechord-library --bins
      - name: Run GTK examples with coverage
        run: |
          mkdir -p coverage
          native_timeout="${PANECHORD_NATIVE_TIMEOUT_SECONDS:-45}s"
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-demo --example controls)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^CONTRACT3 PASS slider closed capacity conversion readonly ' \
            'hidden disabled normalized-display$'
          printf '%s\n' "$output" | grep -q '^MENUS3 PASS nested typed-argument parent-enablement$'
          printf '%s\n' "$output" | grep -q '^DIALOG3 PASS readonly hidden-parent close-reopen$'
          printf '%s\n' "$output" | grep -q '^TABS3 PASS top bottom left right selection retained$'
          printf '%s\n' "$output" | grep -q '^CONTROLS3 PASS checkbox readonly radio slider combo image tab dialog$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-runtime --example scaling)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^SCALING3 PASS: read clones=0, update clones=1, notification counts exact$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-demo -- --smoke)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^PROTOTYPE2 PASS templates=item+content virtualization=1000 ' \
            'conversions=checked validation=async menu=dynamic saves=2 closed=true$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-library -- --smoke)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^LIBRARY3 gtk PASS native-events scan filter selection ' \
            'invalid-folder recovery rescan$'
          printf '%s\n' "$output" | grep -q '^LIBRARY3 gtk PASS native-close model-closed$'
          cargo llvm-cov report -p panechord-runtime -p panechord-demo -p panechord-gtk -p panechord-library \
            --lcov --output-path coverage/raw-examples-gtk.info
          rm -rf target/llvm-cov-target
      - name: Run Tao examples with coverage
        run: |
          mkdir -p target/llvm-cov-target
          native_timeout="${PANECHORD_NATIVE_TIMEOUT_SECONDS:-45}s"
          output=$(timeout "$native_timeout" xvfb-run -a \
            cargo llvm-cov run --no-report --locked -p panechord-demo --example controls \
            --no-default-features --features backend-tao)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^CONTRACT3 PASS slider closed capacity conversion readonly ' \
            'hidden disabled normalized-display$'
          printf '%s\n' "$output" | grep -q '^MENUS3 PASS nested typed-argument parent-enablement$'
          printf '%s\n' "$output" | grep -q '^DIALOG3 PASS readonly hidden-parent close-reopen$'
          printf '%s\n' "$output" | grep -q '^TABS3 PASS top bottom left right selection retained$'
          printf '%s\n' "$output" | grep -q '^CONTROLS3 PASS checkbox readonly radio slider combo image tab dialog$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-demo --no-default-features --features backend-tao \
            -- --smoke)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^PROTOTYPE2 PASS templates=item+content virtualization=1000 ' \
            'conversions=checked validation=async menu=dynamic saves=2 closed=true$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-library --no-default-features --features backend-tao \
            -- --smoke)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^LIBRARY3 tao PASS native-events scan filter selection ' \
            'invalid-folder recovery rescan$'
          printf '%s\n' "$output" | grep -q '^LIBRARY3 tao PASS native-close model-closed$'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-tao --example native_smoke)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^native-smoke: close callback OK'
          output=$(timeout "$native_timeout" xvfb-run -a cargo llvm-cov run --no-report --locked \
            -p panechord-tao --example multiwindow)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^TAO3 PASS multiwindow drawn shared-store primary-close reopen ' \
            'foreign-and-closed-rejected veto-drain-close recoverable-auxiliary-error-isolated$'
          cargo llvm-cov report -p panechord-tao -p panechord-demo -p panechord-library \
            --lcov --output-path coverage/raw-examples-tao.info
          rm -rf target/llvm-cov-target
          mkdir -p coverage
          sh scripts/lcov-workspace.sh coverage/raw-examples-gtk.info coverage/lcov-linux-examples-gtk.info
          rm coverage/raw-examples-gtk.info
          sh scripts/lcov-workspace.sh coverage/raw-examples-tao.info coverage/lcov-linux-examples-tao.info
          rm coverage/raw-examples-tao.info
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-linux-examples
          path: coverage/*.info
          retention-days: 1

  build-windows:
    name: Build Windows archive
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      # Prebuilt upstream binaries (Windows cannot use the Linux container
      # image). Versions follow the 3-day minimum-age rule; keep in sync
      # with .github/workflows/docker/Dockerfile.ci.
      - name: Restore prebuilt tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ${{ runner.os }}-ci-tools-nextest-${{ env.NEXTEST_VERSION }}-llvm-cov-${{ env.LLVM_COV_VERSION }}
      - name: Download prebuilt tools on cache miss
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          $tools = "$env:RUNNER_TEMP\ci-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $ntBase = "https://github.com/nextest-rs/nextest/releases/download"
          $ntFile = "cargo-nextest-$env:NEXTEST_VERSION-x86_64-pc-windows-msvc.zip"
          $lcBase = "https://github.com/taiki-e/cargo-llvm-cov/releases/download"
          $lcFile = "cargo-llvm-cov-x86_64-pc-windows-msvc.zip"
          curl.exe --proto '=https' -fsSL -o "$tools\nextest.zip" "$ntBase/cargo-nextest-$env:NEXTEST_VERSION/$ntFile"
          curl.exe --proto '=https' -fsSL -o "$tools\llvm-cov.zip" "$lcBase/v$env:LLVM_COV_VERSION/$lcFile"
          Expand-Archive -Path "$tools\nextest.zip" -DestinationPath $tools -Force
          Expand-Archive -Path "$tools\llvm-cov.zip" -DestinationPath $tools -Force
          & "$tools\cargo-nextest.exe" --version
          & "$tools\cargo-llvm-cov.exe" llvm-cov --version
      - name: Add tools to PATH
        run: |
          "$env:RUNNER_TEMP\ci-tools" >> $env:GITHUB_PATH
      - name: Save prebuilt tools
        if: steps.tools-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Unique target cache per job: heterogeneous jobs sharing one key
          # poison each other (e.g. a clippy-only or failed partial target).
          # The registry stays shared via shared-key (immutable content).
          key: panechord-build-windows
          shared-key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
          workspaces: |
            . -> target
            . -> target/llvm-cov-target
      - name: Tao demo build (Windows backend)
        run: cargo build --locked -p panechord-demo --no-default-features --features backend-tao
      - name: Tao demo clippy (Windows backend)
        run: >-
          cargo clippy --locked -p panechord-demo --all-targets
          --no-default-features --features backend-tao -- -D warnings
      - name: Build test archives (Tao backend)
        run: |
          mkdir artifacts
          cargo llvm-cov nextest-archive -p panechord-runtime -p panechord-markup -p panechord-macros `
            -p panechord-tao -p panechord-library `
            --no-default-features --features backend-tao -E 'not binary(cargo_ui)' `
            --archive-file artifacts/windows.tar.zst
      - name: Upload test archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-archive-windows
          path: artifacts/*.tar.zst
          compression-level: 0
          retention-days: 1

  run-windows:
    name: Windows tests (nextest)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      # Prebuilt upstream binaries (Windows cannot use the Linux container
      # image). Versions follow the 3-day minimum-age rule; keep in sync
      # with .github/workflows/docker/Dockerfile.ci.
      - name: Restore prebuilt tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ${{ runner.os }}-ci-tools-nextest-${{ env.NEXTEST_VERSION }}-llvm-cov-${{ env.LLVM_COV_VERSION }}
      - name: Download prebuilt tools on cache miss
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          $tools = "$env:RUNNER_TEMP\ci-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $ntBase = "https://github.com/nextest-rs/nextest/releases/download"
          $ntFile = "cargo-nextest-$env:NEXTEST_VERSION-x86_64-pc-windows-msvc.zip"
          $lcBase = "https://github.com/taiki-e/cargo-llvm-cov/releases/download"
          $lcFile = "cargo-llvm-cov-x86_64-pc-windows-msvc.zip"
          curl.exe --proto '=https' -fsSL -o "$tools\nextest.zip" "$ntBase/cargo-nextest-$env:NEXTEST_VERSION/$ntFile"
          curl.exe --proto '=https' -fsSL -o "$tools\llvm-cov.zip" "$lcBase/v$env:LLVM_COV_VERSION/$lcFile"
          Expand-Archive -Path "$tools\nextest.zip" -DestinationPath $tools -Force
          Expand-Archive -Path "$tools\llvm-cov.zip" -DestinationPath $tools -Force
          & "$tools\cargo-nextest.exe" --version
          & "$tools\cargo-llvm-cov.exe" llvm-cov --version
      - name: Add tools to PATH
        run: |
          "$env:RUNNER_TEMP\ci-tools" >> $env:GITHUB_PATH
      - name: Save prebuilt tools
        if: steps.tools-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-archive-windows
          path: artifacts
      - name: Run tests with coverage
        run: |
          mkdir coverage, target/llvm-cov-target -Force | Out-Null
          $root = ((Get-Location).Path -replace '\\', '/') + '/'
          cargo llvm-cov nextest --no-report --archive-file artifacts/windows.tar.zst
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov report --nextest-archive-file artifacts/windows.tar.zst `
            -p panechord-runtime -p panechord-markup -p panechord-macros -p panechord-tao -p panechord-library `
            --lcov --output-path coverage/raw.info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content coverage/raw.info |
            Where-Object { $_ -notmatch '^SF:' -or $_.Substring(3).StartsWith($root) } |
            ForEach-Object { $_ -replace ('^SF:' + [regex]::Escape($root)), 'SF:' } |
            Set-Content coverage/lcov-windows.info
          Remove-Item coverage/raw.info
          Get-ChildItem coverage/
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-windows
          path: coverage/*.info
          retention-days: 1

