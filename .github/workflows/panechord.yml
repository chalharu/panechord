name: Panechord

on:
  push:
    paths:
      - "**.rs"
      - "**.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/panechord.yml"
      - ".github/workflows/docker/Dockerfile.ci"
  pull_request:
    paths:
      - "**.rs"
      - "**.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/panechord.yml"
      - ".github/workflows/docker/Dockerfile.ci"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panechord-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-image:
    name: Prepare image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    outputs:
      image_tag: "${{ steps.set-tag.outputs.tag }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ hashFiles('.github/workflows/docker/Dockerfile.ci') }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd7795515696795f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if image exists
        id: check-image
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: docker pull "ghcr.io/$GH_REPO/ci-image-panechord:$IMAGE_TAG"
      - name: Build and push if not exists
        if: steps.check-image.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/workflows/docker/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ steps.set-tag.outputs.tag }}
          provenance: false

  # The Linux formal gate runs as four parallel container jobs over
  # `scripts/verify.sh` sections (plus release budgets). System dependencies
  # are baked into the container image: no apt-get runs at runtime, so
  # Ubuntu-repository flakes cannot fail the gate. Local runs keep using
  # `sh scripts/verify-docker.sh` (the unsectioned `all` gate).
  linux-lint:
    name: Linux lint
    needs: prepare-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: Format and Clippy
        run: sh scripts/verify.sh lint

  linux-headless:
    name: Linux headless tests
    needs: prepare-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: Headless framework tests
        run: sh scripts/verify.sh headless

  linux-gtk:
    name: Linux GTK gates
    needs: prepare-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: GTK native gates
        run: sh scripts/verify.sh gtk

  linux-tao:
    name: Linux Tao gates
    needs: prepare-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: Tao native gates
        run: sh scripts/verify.sh tao

  linux-measure:
    name: Linux release CPU budgets
    needs: prepare-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}/ci-image-panechord:${{ needs.prepare-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: "true"
          workspaces: |
            . -> target
      - name: Release CPU budgets
        run: sh scripts/measure.sh

  windows:
    name: Windows Tao Demo Gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Format check
        run: >-
          cargo fmt -p panechord -p panechord-runtime -p panechord-markup -p panechord-macros
          -p panechord-tao -p panechord-demo -p panechord-library -- --check
      - name: Headless framework tests
        run: cargo test --locked -p panechord-runtime -p panechord-markup -p panechord-macros
      - name: Tao demo build (Windows backend)
        run: cargo build --locked -p panechord-demo --no-default-features --features backend-tao
      - name: Tao demo clippy
        run: >-
          cargo clippy --locked -p panechord-demo --all-targets --no-default-features
          --features backend-tao -- -D warnings
