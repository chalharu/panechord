[workspace]
members = [
  ".",
  "demo",
  "gtk",
  "library",
  "macos",
  "macros",
  "markup",
  "native",
  "runtime",
  "tao",
]
resolver = "3"

[package]
categories = ["gui"]
description = "Declarative Rust UI with shared state and native backends"
edition.workspace = true
license.workspace = true
name = "panechord"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
panechord-gtk = { optional = true, workspace = true }
panechord-macos = { optional = true, workspace = true }
panechord-macros.workspace = true
panechord-native = { optional = true, workspace = true }
panechord-runtime.workspace = true
panechord-tao = { optional = true, workspace = true }

[features]
default = []
gtk = ["dep:panechord-gtk"]
macos = ["dep:panechord-macos"]
native = ["dep:panechord-native"]
tao = ["dep:panechord-tao"]

[profile.dev]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
strip = "debuginfo"

[workspace.package]
authors = ["chalharu"]
description = "Declarative Rust UI with shared state and native backends"
edition = "2024"
homepage = "https://github.com/chalharu/panechord"
license = "MPL-2.0"
repository = "https://github.com/chalharu/panechord"
rust-version = "1.95"
version = "0.1.0-dev"

[workspace.dependencies]
futures = { version = "=0.3.34" }
futures-timer = { version = "=3.0.4" }
gtk = { version = "=0.18.2" }
gtk4 = { features = ["v4_8"], version = "=0.11.5" }
iced = { default-features = false, features = [
  "advanced",
  "image-without-codecs",
  "lazy",
  "thread-pool",
  "tiny-skia",
  "wayland",
  "x11",
], version = "=0.14.0" }
iced_tiny_skia = { version = "=0.14.1" }
iced_winit = { version = "=0.14.1" }
muda = { version = "=0.21.2" }
objc2 = { version = "=0.6.5" }
objc2-app-kit = { default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "objc2-quartz-core",
], version = "=0.3.2" }
objc2-foundation = { default-features = false, features = [
  "NSString",
], version = "=0.3.2" }
panechord-gtk = { path = "gtk" }
panechord-macos = { path = "macos" }
panechord-macros = { path = "macros" }
panechord-markup = { path = "markup" }
panechord-native = { path = "native" }
panechord-runtime = { path = "runtime" }
panechord-tao = { path = "tao" }
proc-macro-crate = { version = "=3.5.0" }
proc-macro2 = { version = "=1.0.107" }
quote = { version = "=1.0.47" }
raw-window-handle = { version = "=0.6.2" }
rfd = { version = "=0.17.2" }
schemars = { version = "=1.2.3" }
serde = { default-features = false, version = "=1.0.229" }
serde-saphyr = { version = "=2.0.0" }
serde_json = { version = "=1.0.154" }
serde_path_to_error = { version = "=0.1.20" }
syn = { features = ["extra-traits", "full", "visit-mut"], version = "=3.0.9" }
tao = { version = "=0.37.2" }
window_clipboard = { version = "=0.5.1" }
windows-sys = { version = "=0.61.2" }
