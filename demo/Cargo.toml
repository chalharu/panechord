[package]
name = "panechord-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["backend-gtk"]
backend-gtk = ["dep:panechord-gtk", "dep:gtk4"]
backend-tao = ["dep:panechord-tao"]
backend-macos = ["dep:panechord-macos"]

[dependencies]
futures.workspace = true
futures-timer.workspace = true
gtk4 = { workspace = true, optional = true }
panechord-runtime.workspace = true
panechord-macros.workspace = true
panechord-gtk = { workspace = true, optional = true }
panechord-tao = { workspace = true, optional = true }
panechord-macos = { workspace = true, optional = true }
