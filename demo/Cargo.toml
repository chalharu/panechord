[package]
categories = ["gui"]
description = "Control gallery and smoke demo for Panechord"
edition.workspace = true
license.workspace = true
name = "panechord-demo"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
backend-gtk = ["dep:gtk4", "dep:panechord-gtk"]
backend-macos = ["dep:panechord-macos"]
backend-tao = ["dep:panechord-tao"]
default = ["backend-gtk"]

[dependencies]
futures.workspace = true
futures-timer.workspace = true
gtk4 = { optional = true, workspace = true }
panechord-gtk = { optional = true, workspace = true }
panechord-macos = { optional = true, workspace = true }
panechord-macros.workspace = true
panechord-runtime.workspace = true
panechord-tao = { optional = true, workspace = true }
