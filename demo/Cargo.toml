[package]
categories = ["gui"]
description = "Control gallery and smoke demo for Panechord"
edition.workspace = true
license.workspace = true
name = "panechord-demo"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
backend-gtk = ["panechord/gtk"]
backend-macos = ["panechord/macos"]
backend-tao = ["panechord/tao"]
backend-windows = ["panechord/windows"]
windows-self-contained = ["backend-windows", "panechord/windows-self-contained", "dep:panechord-windows"]
default = ["backend-gtk"]

[dependencies]
futures.workspace = true
futures-timer.workspace = true
panechord = { path = ".." }
panechord-macros.workspace = true
panechord-runtime.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
panechord-windows = { workspace = true, optional = true, default-features = false }

[[example]]
name = "windows_smoke"
path = "examples/windows_smoke.rs"
required-features = ["backend-windows", "windows-self-contained"]
