[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
  # ttf-parser has no patched release addressing this advisory.
  "RUSTSEC-2026-0192",
  # GTK3 macro dependencies have no patched release in the GTK3 line.
  "RUSTSEC-2024-0370",
  # glib 0.18 (GTK3 stack) has no patched release; fixed in 0.20.
  "RUSTSEC-2024-0429",
]

[bans]
multiple-versions = "warn"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
