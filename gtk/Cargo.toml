[package]
authors.workspace = true
categories = ["gui"]
description = "GTK4 backend for Panechord declarative UI"
edition.workspace = true
license.workspace = true
name = "panechord-gtk"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
futures.workspace = true
gtk4.workspace = true
panechord-runtime.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
# Shared golden corpus builder: only compiled for tests/examples, never
# for the release library.
panechord-runtime = { workspace = true, features = ["test-corpus"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { features = [
  "Win32_UI_Input_KeyboardAndMouse",
], workspace = true }
