[package]
categories = ["gui"]
description = "Sandboxed file-library screen for Panechord"
edition.workspace = true
license.workspace = true
name = "panechord-library"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
backend-gtk = ["panechord/gtk"]
backend-macos = ["panechord/macos"]
backend-tao = ["panechord/tao"]
default = ["backend-gtk"]

[dependencies]
futures.workspace = true
futures-timer.workspace = true
panechord = { path = ".." }
panechord-macros.workspace = true
panechord-runtime.workspace = true
