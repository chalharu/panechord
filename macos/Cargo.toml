[package]
authors.workspace = true
build = "build.rs"
categories = ["gui"]
description = "AppKit backend for Panechord declarative UI"
edition.workspace = true
license.workspace = true
links = "PanechordAppKit"
name = "panechord-macos"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
futures.workspace = true
futures-timer = { workspace = true, optional = true }
objc2.workspace = true
panechord-runtime.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
futures-timer.workspace = true
# Shared golden corpus builder: only compiled for tests/examples, never
# for the release library.
panechord-runtime = { workspace = true, features = ["test-corpus"] }

[features]
## Test-only AppKit bridge (layout dump for golden tests). Opt-in so
## release and distribution builds never contain these symbols. Enables
## the shared harness's timer.
test-bridge = ["dep:futures-timer"]
