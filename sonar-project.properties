sonar.projectKey=chalharu_panechord
sonar.organization=chalharu
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=target/**,**/target/**
sonar.rust.lcov.reportPaths=coverage/*.info
sonar.issue.ignore.multicriteria=e1,e2,e3
# CI/dev images run tests as root inside throwaway containers (same accepted
# risk as nerust's sonar exclusions); no secret or host mount is involved.
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*
# scripts/Dockerfile.linux bakes the whole workspace so `cargo fetch` runs
# offline during the image build; it is a local-dev image, never published.
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/Dockerfile.linux
