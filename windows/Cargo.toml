[package]
build = "build.rs"
categories = ["gui"]
description = "SDK-owned WinUI 3 backend for Panechord declarative UI"
edition.workspace = true
license.workspace = true
name = "panechord-windows"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

[dependencies]
panechord-runtime.workspace = true
futures = "=0.3.34"
futures-timer = "=3.0.4"
png = "=0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-reactor = "=0.100.0"
windows-core = "=0.100.0"
windows-collections = "=0.100.0"
windows-future = "=0.100.0"
windows-numerics = "=0.100.0"
windows-time = "=0.100.0"
windows-reference = "=0.100.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { version = "=0.100.0", optional = true }

[features]
default = []
self-contained = ["dep:windows-reactor-setup"]
native-smoke = []

[[example]]
name = "native_smoke"
path = "examples/native_smoke.rs"
required-features = ["self-contained", "native-smoke"]
test = true
bench = false

[package.metadata.panechord-windows]
runtime-nuget-version = "2.4.0"
webview2-nuget-version = "1.0.4078.44"
setup-version = "0.100.0"
cache-only = true