[package]
build = "build.rs"
categories = ["gui"]
description = "SDK-owned WinUI 3 backend for Panechord declarative UI"
edition.workspace = true
license.workspace = true
name = "panechord-windows"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

[dependencies]
futures.workspace = true
futures-timer.workspace = true
panechord-runtime.workspace = true
png.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-collections.workspace = true
windows-core.workspace = true
windows-future.workspace = true
windows-numerics.workspace = true
windows-reactor.workspace = true
windows-reference.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
windows-time.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { workspace = true, optional = true }

[features]
default = []
self-contained = ["dep:windows-reactor-setup"]
native-smoke = []

[[example]]
name = "native_smoke"
path = "examples/native_smoke.rs"
required-features = ["self-contained", "native-smoke"]
test = true
bench = false

[package.metadata.panechord-windows]
runtime-nuget-version = "2.4.0"
webview2-nuget-version = "1.0.4078.44"
setup-version = "0.100.0"
cache-only = true